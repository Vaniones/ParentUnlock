name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: parent-unlock-linux
            asset_name: parent-unlock-x86_64-unknown-linux-gnu
          - os: windows-latest
            artifact_name: parent-unlock.exe
            asset_name: parent-unlock-x86_64-pc-windows-msvc.exe
          - os: macos-latest
            artifact_name: parent-unlock
            asset_name: parent-unlock-x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Build release
        run: cargo build --release --all-features

      - name: Upload Binary to Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/release/${{ matrix.artifact_name }}
          asset_name: ${{ matrix.asset_name }}
          tag: ${{ github.ref }}
          overwrite: true
